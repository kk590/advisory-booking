<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rakshan Kamalakannan — Book Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<style>
:root{--canvas:#050505;--charcoal:#111113;--surface:#1a1a1c;--surface-low:#111113;--surface-container:#1a1a1c;--surface-high:#2a2a2c;--border:#333336;--text:#f4f4f5;--muted:#a1a1aa;--primary:#D4AF37;--primary-light:#F7E7CE;--gold:#FFFDD0;--on-primary:#050505;--error:#ffb4ab}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--canvas);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
header{position:sticky;top:0;z-index:50;background:rgba(5,5,5,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1100px;margin:0 auto;padding:0 1.5rem;height:72px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:56px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}.avatar img{width:100%;height:100%;object-fit:contain;display:block}
.brand-text h1{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}.brand-text p{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--primary);margin-top:2px}
.stepper-bar{max-width:1100px;margin:0 auto;padding:1.1rem 1.5rem 0}.stepper-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.protocol-tag{background:var(--charcoal);color:var(--primary);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--border)}
.steps-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.step-item{display:flex;flex-direction:column;gap:6px;opacity:.4;transition:opacity .2s}.step-item.active,.step-item.done{opacity:1}.step-line{height:3px;background:var(--border);transition:background .25s}.step-item.active .step-line{background:var(--primary);box-shadow:0 0 12px rgba(212,175,55,.35)}.step-item.done .step-line{background:var(--primary)}
.step-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;color:var(--muted)}.step-item.active .step-label{color:var(--primary);font-weight:600}.step-item.done .step-label{color:var(--primary-light)}
main{max-width:1100px;margin:0 auto;padding:1.75rem 1.5rem 4rem}.panel{display:none;animation:fadeIn .3s ease}.panel.active{display:block}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);display:flex;align-items:center;gap:6px;margin-bottom:8px}.section-kicker .dot{width:6px;height:6px;background:var(--primary);border-radius:50%;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
h2.page-title{font-family:'Syne',sans-serif;font-size:clamp(22px,4vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.2}.page-desc{color:var(--muted);margin-top:10px;max-width:560px;font-size:14px;line-height:1.7}
.duration-grid{display:grid;grid-template-columns:1fr;gap:1.25rem;margin-top:2rem}@media(min-width:900px){.duration-grid{grid-template-columns:5fr 7fr}}
.duration-card{background:var(--charcoal);border:1px solid var(--border);padding:1.75rem;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;display:flex;flex-direction:column;justify-content:space-between;gap:1.25rem}.duration-card:hover{border-color:rgba(212,175,55,.5);transform:translateY(-2px);box-shadow:0 0 40px -8px rgba(212,175,55,.12)}.duration-card.recommended{border-color:rgba(212,175,55,.4)}
.card-tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}.card-tag .badge{background:var(--surface-container);color:var(--primary);padding:3px 8px;font-size:10px}
.recommended-pill{background:linear-gradient(90deg,#D4AF37,#F7E7CE);color:#050505;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;display:inline-flex;align-items:center;gap:4px}
.card-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}.card-desc{color:var(--muted);font-size:12px;line-height:1.6}
.price-block{background:var(--surface);padding:1rem;margin:1rem 0;display:flex;justify-content:space-between;align-items:baseline}.price-block .amount{font-family:'Syne',sans-serif;font-size:28px;font-weight:700}.price-block .amount.gold{color:var(--gold);font-size:32px}
.feature-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin:12px 0}.feature-list li{display:flex;gap:8px;align-items:flex-start;font-size:12px}.feature-list .material-symbols-outlined{color:var(--primary);font-size:16px;margin-top:1px}
.card-cta{width:100%;padding:14px 18px;background:var(--surface-container);border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .2s,color .2s}.duration-card:hover .card-cta{background:var(--surface-high);color:var(--gold)}.duration-card.recommended .card-cta{background:var(--primary);color:var(--on-primary)}.duration-card.recommended:hover .card-cta{background:#c19b2e}
.cal-wrap{display:grid;grid-template-columns:1fr;gap:1.25rem;margin-top:1.75rem;background:var(--charcoal);border:1px solid var(--border);padding:1.25rem}@media(min-width:860px){.cal-wrap{grid-template-columns:1fr 240px}}#calendar{max-width:100%}
.fc{--fc-border-color:var(--border);--fc-page-bg-color:transparent;--fc-neutral-bg-color:var(--surface);--fc-button-bg-color:var(--surface-container);--fc-button-border-color:var(--border);--fc-button-hover-bg-color:var(--surface-high);--fc-button-active-bg-color:var(--primary);--fc-today-bg-color:rgba(212,175,55,.08);--fc-event-bg-color:var(--primary);color:var(--text)}.fc .fc-toolbar-title{font-family:'Syne',sans-serif;font-size:16px!important;font-weight:700}.fc .fc-button{border-radius:0!important;font-family:'JetBrains Mono';font-size:11px;text-transform:uppercase;letter-spacing:.06em}.fc .fc-daygrid-day-number{color:var(--text);font-size:12px}.fc .fc-col-header-cell-cushion{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.fc-daygrid-day:hover{background:rgba(212,175,55,.06);cursor:pointer}
.slots-col h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}.slots{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow-y:auto}.slot{padding:10px;border:1px solid var(--border);background:var(--canvas);color:var(--text);font-family:inherit;font-size:12px;text-align:center;cursor:pointer;transition:all .15s}.slot:hover{border-color:var(--primary);color:var(--primary)}.slot.selected{background:rgba(212,175,55,.12);border-color:var(--primary);color:var(--gold);font-weight:600;box-shadow:0 0 20px -4px rgba(212,175,55,.25)}.slot:disabled{opacity:.3;cursor:not-allowed}
form{display:flex;flex-direction:column;gap:1rem;margin-top:1.5rem;max-width:480px}label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}input{background:var(--canvas);border:1px solid var(--border);color:var(--text);padding:12px 14px;font-family:inherit;font-size:13px;border-radius:0}input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 1px rgba(212,175,55,.3)}input::placeholder{color:#52525b}.error{color:var(--error);font-size:12px;min-height:16px}.summary-chip{display:inline-block;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);color:var(--gold);font-size:11px;letter-spacing:.04em;padding:8px 14px;margin-top:12px}
.nav{display:flex;gap:12px;margin-top:1.25rem;flex-wrap:wrap}.btn{border:none;padding:12px 20px;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}.btn.primary{background:var(--primary);color:var(--on-primary)}.btn.primary:hover{background:#c19b2e;box-shadow:0 0 28px -4px rgba(212,175,55,.4)}.btn.primary.big{padding:14px 28px;font-size:12px}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn.ghost:hover{border-color:var(--primary);color:var(--primary);background:rgba(212,175,55,.05)}.btn:disabled{opacity:.45;cursor:not-allowed}
.pay-layout{display:grid;grid-template-columns:1fr;gap:1.5rem;margin-top:1.5rem}@media(min-width:900px){.pay-layout{grid-template-columns:5fr 7fr}}.dossier{background:var(--charcoal);border:1px solid var(--border);padding:1.5rem}.dossier-header{display:flex;justify-content:space-between;align-items:center;margin:-1.5rem -1.5rem 1.25rem;padding:12px 1.5rem;background:var(--canvas);border-bottom:1px solid var(--border)}.pay-box{background:var(--charcoal);border:1px solid var(--border);padding:2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center}#qr{background:#fff;padding:12px}#qr img{display:block;width:180px;height:180px}#upiString{word-break:break-all;max-width:360px;font-size:11px;color:var(--muted)}.verify-box{margin-top:1.5rem;border-top:1px dashed var(--border);padding-top:1.5rem;width:100%}@keyframes spin{to{transform:rotate(360deg)}}
.panel.center{text-align:center;padding-top:6vh}.check{width:72px;height:72px;background:var(--primary);color:var(--on-primary);font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;box-shadow:0 0 40px -4px rgba(212,175,55,.45)}
.manifest{background:var(--surface-low);border:1px solid var(--border);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem}.manifest-left{display:flex;align-items:center;gap:12px}.manifest-icon{width:44px;height:44px;background:var(--canvas);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}.manifest-icon .material-symbols-outlined{color:var(--primary)}
.privacy-note{margin-top:1.5rem;font-size:11px;color:var(--muted);max-width:520px;line-height:1.6}
@media(max-width:640px){.steps-grid{gap:4px}.step-label span:first-child{font-size:8px}.header-inner{height:68px;padding:0 1rem}main{padding:1.25rem 1rem 3rem}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="avatar">
        <img src="https://landing-page-three-ochre-80.vercel.app/rk-logo.png" alt="RK Logo" width="42" height="56" />
      </div>
      <div class="brand-text">
        <h1>Rakshan Kamalakannan</h1>
        <p>MAS Automation Consultant</p>
      </div>
    </div>
    <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:4px 10px;">Currency: <span style="color:var(--primary);font-weight:600;">INR (₹)</span></div>
  </div>
</header>
<div class="stepper-bar">
  <div class="stepper-meta">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span class="protocol-tag">SYSTEM_DISPATCH // PROTOCOL_V4.2</span>
      <span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);" id="stageLabel">STAGE: DURATION_VALIDATION</span>
    </div>
  </div>
  <div class="steps-grid" id="stepIndicator">
    <div class="step-item active" data-step="1"><div class="step-line"></div><div class="step-label"><span>01. DURATION</span><span>●</span></div></div>
    <div class="step-item" data-step="2"><div class="step-line"></div><div class="step-label"><span>02. SCHEDULE</span><span>○</span></div></div>
    <div class="step-item" data-step="3"><div class="step-line"></div><div class="step-label"><span>03. DETAILS</span><span>○</span></div></div>
    <div class="step-item" data-step="4"><div class="step-line"></div><div class="step-label"><span>04. UPI_SETTLE</span><span>○</span></div></div>
    <div class="step-item" data-step="5"><div class="step-line"></div><div class="step-label"><span>05. CONFIRMED</span><span>○</span></div></div>
  </div>
</div>
<main>

</main>
</body>
</html>
